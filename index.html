<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>UtamaGo! — Aplikasi Belajar JLPT Gratis</title>
    <meta
      name="description"
      content="Platform persiapan JLPT terstruktur dengan Anki (Kanji & Moji-Goi), Bunpou, Dokkai, dan Try Out beserta Laporan Belajar."
    />
    <meta property="og:title" content="UtamaGo! — Aplikasi Belajar JLPT Gratis" />
    <meta
      property="og:description"
      content="Platform persiapan JLPT terstruktur dengan Anki (Kanji & Moji-Goi), Bunpou, Dokkai, dan Try Out beserta Laporan Belajar."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('utamago_theme_mode_v1');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode !== 'light' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0d0d10');
          }
          var scale = localStorage.getItem('utamago_text_scale_v1');
          if (scale === 'large') {
            document.documentElement.style.fontSize = '112.5%';
          } else if (scale === 'xlarge') {
            document.documentElement.style.fontSize = '125%';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
