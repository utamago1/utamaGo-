<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>UtamaGo! 45s Interactive Promo Stage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    canvas { display: block; width: 1080px; height: 1920px; }
  </style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false });

const ASSETS = {
  home: './ss-home.png',
  ankiDeck: './ss-anki-deck.png',
  ankiCard: './ss-anki-card.png',
  bunpouList: './ss-bunpou-list.png',
  bunpouOpen: './ss-bunpou-open.png',
  tryout: './ss-tryout.png',
  tryoutExam: './ss-tryout-exam.png',
  kamus: './ss-kamus.png',
  darkHome: './ss-dark-home.png',
  logo: './logo.jpg',
  mascot: './mascot.png',
};

const IMGS = {};
window.__STAGE_READY = false;

async function preload() {
  const entries = Object.entries(ASSETS);
  await Promise.all(entries.map(([key, src]) => new Promise((res, rej) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { IMGS[key] = img; res(); };
    img.onerror = (e) => rej(new Error('Failed loading ' + src));
    img.src = src;
  })));
  if (document.fonts && document.fonts.ready) {
    await document.fonts.ready;
  }
  window.__STAGE_READY = true;
}
preload();

// Math & Easing helpers
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const norm = (t, t0, t1) => clamp((t - t0) / Math.max(0.0001, t1 - t0), 0, 1);
const easeOutCubic = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeInOutCubic = (x) => {
  x = clamp(x);
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
};
const easeOutBack = (x) => {
  x = clamp(x);
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
};
const easeOutQuart = (x) => 1 - Math.pow(1 - clamp(x), 4);

const FONT_SANS = '"Plus Jakarta Sans", "Noto Sans JP", system-ui, -apple-system, sans-serif';
const FONT_JP = '"Noto Sans JP", "Plus Jakarta Sans", sans-serif';

// Rounded rectangle path helper
function rrect(x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}

function drawEditorialBg(t, darkMix = 0) {
  // Base warm washi cream (#FAF7F1) blended toward rich obsidian (#131211)
  const bgTopR = Math.round(lerp(251, 20, darkMix));
  const bgTopG = Math.round(lerp(248, 19, darkMix));
  const bgTopB = Math.round(lerp(242, 18, darkMix));
  const bgBotR = Math.round(lerp(243, 12, darkMix));
  const bgBotG = Math.round(lerp(237, 11, darkMix));
  const bgBotB = Math.round(lerp(228, 11, darkMix));

  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, `rgb(${bgTopR},${bgTopG},${bgTopB})`);
  grad.addColorStop(1, `rgb(${bgBotR},${bgBotG},${bgBotB})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle ambient Japanese vermilion & gold orbs
  const orb1x = 180 + Math.sin(t * 0.45) * 60;
  const orb1y = 260 + Math.cos(t * 0.35) * 40;
  const g1 = ctx.createRadialGradient(orb1x, orb1y, 20, orb1x, orb1y, 540);
  g1.addColorStop(0, darkMix > 0.5 ? 'rgba(220,38,38,0.18)' : 'rgba(220,38,38,0.09)');
  g1.addColorStop(1, 'rgba(220,38,38,0)');
  ctx.fillStyle = g1;
  ctx.fillRect(0, 0, W, H);

  const orb2x = 900 + Math.cos(t * 0.4) * 55;
  const orb2y = 1480 + Math.sin(t * 0.3) * 60;
  const g2 = ctx.createRadialGradient(orb2x, orb2y, 20, orb2x, orb2y, 580);
  g2.addColorStop(0, darkMix > 0.5 ? 'rgba(245,158,11,0.12)' : 'rgba(245,158,11,0.09)');
  g2.addColorStop(1, 'rgba(245,158,11,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, W, H);

  // Subtle architectural dot grid (editorial Japanese stationery feel)
  ctx.fillStyle = darkMix > 0.5 ? 'rgba(255,255,255,0.045)' : 'rgba(28,25,23,0.045)';
  const step = 64;
  for (let gx = 44; gx < W; gx += step) {
    for (let gy = 140; gy < H - 80; gy += step) {
      ctx.beginPath();
      ctx.arc(gx, gy, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// Top Instagram-Stories style 6-segment progress bar + brand header
const SEGMENTS = [
  { s: 0.0, e: 5.5, label: 'UtamaGo!' },
  { s: 5.5, e: 12.0, label: 'Beranda' },
  { s: 12.0, e: 20.0, label: 'Anki SRS' },
  { s: 20.0, e: 27.5, label: 'Bunpou' },
  { s: 27.5, e: 34.5, label: 'Try Out' },
  { s: 34.5, e: 45.0, label: 'Kamus & Mulai' },
];

function drawTopProgressBar(t, darkMix = 0) {
  const padX = 48;
  const gap = 10;
  const barY = 58;
  const barH = 7;
  const segW = (W - padX * 2 - gap * (SEGMENTS.length - 1)) / SEGMENTS.length;

  for (let i = 0; i < SEGMENTS.length; i++) {
    const seg = SEGMENTS[i];
    const sx = padX + i * (segW + gap);
    const fillPct = clamp((t - seg.s) / (seg.e - seg.s), 0, 1);

    ctx.fillStyle = darkMix > 0.5 ? 'rgba(255,255,255,0.16)' : 'rgba(28,25,23,0.11)';
    rrect(sx, barY, segW, barH, 4);
    ctx.fill();

    if (fillPct > 0) {
      ctx.fillStyle = '#DC2626';
      rrect(sx, barY, Math.max(8, segW * fillPct), barH, 4);
      ctx.fill();
    }
  }

  // Subtle top-right time indicator & top-left mini logo
  ctx.save();
  ctx.globalAlpha = 0.92;
  rrect(padX, 84, 42, 42, 11);
  ctx.save();
  ctx.clip();
  ctx.drawImage(IMGS.logo, padX, 84, 42, 42);
  ctx.restore();

  ctx.font = `800 24px ${FONT_SANS}`;
  ctx.fillStyle = darkMix > 0.5 ? '#FAFAF9' : '#1C1917';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('UtamaGo!', padX + 54, 105);

  // BETA mini tag
  ctx.fillStyle = darkMix > 0.5 ? 'rgba(220,38,38,0.22)' : 'rgba(220,38,38,0.11)';
  rrect(padX + 184, 90, 74, 30, 8);
  ctx.fill();
  ctx.font = `800 15px ${FONT_SANS}`;
  ctx.fillStyle = '#DC2626';
  ctx.textAlign = 'center';
  ctx.fillText('N5–N1', padX + 221, 106);

  // Right live timer badge
  const secStr = `${String(Math.min(45, Math.floor(t))).padStart(2, '0')}s / 45s`;
  ctx.font = `700 20px ${FONT_SANS}`;
  ctx.fillStyle = darkMix > 0.5 ? 'rgba(255,255,255,0.58)' : 'rgba(28,25,23,0.52)';
  ctx.textAlign = 'right';
  ctx.fillText(secStr, W - padX, 105);
  ctx.restore();
}

// Editorial Section Title Block (y = 155..390)
function drawSceneHeader(eyebrow, line1, line2, enterT, darkMix = 0, accentWord = null) {
  const e = easeOutQuart(enterT);
  const yOff = (1 - e) * 34;

  ctx.save();
  ctx.globalAlpha = clamp(e * 1.25);

  // Eyebrow pill
  ctx.font = `800 22px ${FONT_SANS}`;
  const ew = ctx.measureText(eyebrow).width + 44;
  const ex = (W - ew) / 2;
  const ey = 160 + yOff;
  ctx.fillStyle = darkMix > 0.5 ? 'rgba(220,38,38,0.24)' : 'rgba(220,38,38,0.10)';
  rrect(ex, ey, ew, 46, 23);
  ctx.fill();
  ctx.strokeStyle = darkMix > 0.5 ? 'rgba(248,113,113,0.4)' : 'rgba(220,38,38,0.25)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = darkMix > 0.5 ? '#FCA5A5' : '#B91C1C';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(eyebrow, W / 2, ey + 24);

  // Headline Line 1
  ctx.font = `800 66px ${FONT_SANS}`;
  ctx.fillStyle = darkMix > 0.5 ? '#FAFAF9' : '#171614';
  ctx.fillText(line1, W / 2, 266 + yOff);

  // Headline Line 2 (with optional vermilion emphasis)
  ctx.font = `800 66px ${FONT_SANS}`;
  if (accentWord && line2.includes(accentWord)) {
    const idx = line2.indexOf(accentWord);
    const before = line2.slice(0, idx);
    const after = line2.slice(idx + accentWord.length);
    const wB = ctx.measureText(before).width;
    const wA = ctx.measureText(accentWord).width;
    const wC = ctx.measureText(after).width;
    const startX = W / 2 - (wB + wA + wC) / 2;
    ctx.textAlign = 'left';
    ctx.fillStyle = darkMix > 0.5 ? '#FAFAF9' : '#171614';
    ctx.fillText(before, startX, 344 + yOff);
    ctx.fillStyle = darkMix > 0.5 ? '#F87171' : '#DC2626';
    ctx.fillText(accentWord, startX + wB, 344 + yOff);
    ctx.fillStyle = darkMix > 0.5 ? '#FAFAF9' : '#171614';
    ctx.fillText(after, startX + wB + wA, 344 + yOff);
  } else {
    ctx.fillStyle = darkMix > 0.5 ? '#F87171' : '#DC2626';
    ctx.fillText(line2, W / 2, 344 + yOff);
  }

  ctx.restore();
}

// Draw sleek modern smartphone mockup with real app screenshot inside
// Returns screen rect { sx, sy, sw, sh } in canvas coordinates for interactive cursor targeting
function drawPhone(cx, cy, screenW, img, opts = {}) {
  const {
    scale = 1,
    rot = 0,
    alpha = 1,
    nextImg = null,
    trans = 0,          // 0..1 transition between img and nextImg
    transMode = 'slide', // 'slide' | 'pop' | 'fade'
    darkBezel = true,
    zoom = 1,
    panY = 0,
    highlightBox = null, // { nx, ny, nw, nh, color, alpha } normalized 0..1 on screen
  } = opts;

  const aspect = 844 / 390;
  const sw = screenW;
  const sh = Math.round(screenW * aspect);
  const bezel = Math.round(screenW * 0.036);
  const bw = sw + bezel * 2;
  const bh = sh + bezel * 2;
  const outerR = Math.round(screenW * 0.13);
  const innerR = Math.round(screenW * 0.105);

  ctx.save();
  ctx.globalAlpha = clamp(alpha);
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.scale(scale, scale);

  // Realistic soft studio drop shadow (fast layered shadow — 20x faster than software shadowBlur)
  const shLayers = [
    { dy: 44, pad: 22, a: 0.06 },
    { dy: 30, pad: 12, a: 0.10 },
    { dy: 16, pad: 4, a: 0.14 },
  ];
  for (const sl of shLayers) {
    rrect(-bw / 2 - sl.pad, -bh / 2 + sl.dy - sl.pad * 0.5, bw + sl.pad * 2, bh + sl.pad * 1.5, outerR + sl.pad);
    ctx.fillStyle = `rgba(15, 12, 10, ${sl.a})`;
    ctx.fill();
  }

  // Metallic outer rim
  const rimGrad = ctx.createLinearGradient(-bw / 2, -bh / 2, bw / 2, bh / 2);
  rimGrad.addColorStop(0, '#44403C');
  rimGrad.addColorStop(0.5, '#1C1917');
  rimGrad.addColorStop(1, '#3F3A36');
  rrect(-bw / 2, -bh / 2, bw, bh, outerR);
  ctx.fillStyle = rimGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Inner black screen housing
  rrect(-sw / 2 - 4, -sh / 2 - 4, sw + 8, sh + 8, innerR + 2);
  ctx.fillStyle = '#0B0A0A';
  ctx.fill();

  // Clipped real app screenshot canvas
  ctx.save();
  rrect(-sw / 2, -sh / 2, sw, sh, innerR);
  ctx.clip();

  ctx.fillStyle = '#FAF8F4';
  ctx.fillRect(-sw / 2, -sh / 2, sw, sh);

  const drawImgInside = (imageObj, ox = 0, oy = 0, sc = 1, op = 1) => {
    if (!imageObj) return;
    ctx.save();
    ctx.globalAlpha = clamp(op);
    ctx.translate(ox, oy);
    ctx.scale(sc, sc);
    ctx.drawImage(imageObj, -sw / 2, -sh / 2, sw, sh);
    ctx.restore();
  };

  if (nextImg && trans > 0) {
    const tr = easeInOutCubic(trans);
    if (transMode === 'slide') {
      drawImgInside(img, -sw * tr * 0.35, panY, zoom, 1 - tr * 0.3);
      drawImgInside(nextImg, sw * (1 - tr), panY, zoom, 1);
    } else if (transMode === 'pop') {
      drawImgInside(img, 0, panY, lerp(1, 0.94, tr), 1 - tr * 0.5);
      drawImgInside(nextImg, 0, (1 - tr) * 70, lerp(0.92, 1.0, tr), tr);
    } else {
      drawImgInside(img, 0, panY, zoom, 1 - tr);
      drawImgInside(nextImg, 0, panY, zoom, tr);
    }
  } else {
    drawImgInside(img, 0, panY, zoom, 1);
  }

  // Optional crisp interactive highlight rectangle inside screen (e.g., chosen exam option!)
  if (highlightBox && highlightBox.alpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = clamp(highlightBox.alpha);
    const hx = -sw / 2 + highlightBox.nx * sw;
    const hy = -sh / 2 + highlightBox.ny * sh;
    const hw = highlightBox.nw * sw;
    const hh = highlightBox.nh * sh;
    rrect(hx, hy, hw, hh, 18);
    ctx.fillStyle = highlightBox.fill || 'rgba(16, 185, 129, 0.16)';
    ctx.fill();
    ctx.strokeStyle = highlightBox.color || '#10B981';
    ctx.lineWidth = 4.5;
    ctx.stroke();
    ctx.restore();
  }

  // Subtle Dynamic Island top pill (minimal so app header stays 100% readable)
  ctx.fillStyle = '#0C0B0A';
  rrect(-56, -sh / 2 + 10, 112, 22, 11);
  ctx.fill();

  // Soft top-left glass specular sheen
  const sheen = ctx.createLinearGradient(-sw / 2, -sh / 2, sw * 0.35, sh * 0.2);
  sheen.addColorStop(0, 'rgba(255,255,255,0.12)');
  sheen.addColorStop(0.45, 'rgba(255,255,255,0.02)');
  sheen.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sheen;
  ctx.fillRect(-sw / 2, -sh / 2, sw, sh);

  ctx.restore(); // end clip
  ctx.restore();

  return {
    sx: cx - (sw * scale) / 2,
    sy: cy - (sh * scale) / 2,
    sw: sw * scale,
    sh: sh * scale,
  };
}

// Animated interactive touch pointer + tactile expanding vermilion ripple
function drawInteractiveTap(x, y, tapProgress, appearAlpha = 1) {
  ctx.save();
  ctx.globalAlpha = clamp(appearAlpha);

  // Tap ripple waves (tapProgress: 0 = just tapped, 1 = ripple faded)
  if (tapProgress > 0 && tapProgress < 1) {
    const p1 = easeOutCubic(tapProgress);
    ctx.beginPath();
    ctx.arc(x, y, 22 + p1 * 76, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(220, 38, 38, ${(1 - tapProgress) * 0.85})`;
    ctx.lineWidth = 6 * (1 - tapProgress * 0.6);
    ctx.stroke();

    if (tapProgress > 0.12) {
      const p2 = easeOutCubic((tapProgress - 0.12) / 0.88);
      ctx.beginPath();
      ctx.arc(x, y, 16 + p2 * 52, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220, 38, 38, ${(1 - p2) * 0.28})`;
      ctx.fill();
    }
  }

  // Tactile translucent finger-dot ring (Apple/Figma interactive demo style)
  const pressScale = (tapProgress > 0 && tapProgress < 0.25)
    ? lerp(1, 0.78, Math.sin((tapProgress / 0.25) * Math.PI))
    : 1;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(pressScale, pressScale);

  // Soft shadow
  ctx.shadowColor = 'rgba(0,0,0,0.28)';
  ctx.shadowBlur = 18;
  ctx.shadowOffsetY = 6;

  // Outer frosted touch halo
  ctx.beginPath();
  ctx.arc(0, 0, 28, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.86)';
  ctx.fill();
  ctx.strokeStyle = '#DC2626';
  ctx.lineWidth = 4.5;
  ctx.stroke();

  // Inner vermilion core dot
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(0, 0, 10, 0, Math.PI * 2);
  ctx.fillStyle = '#DC2626';
  ctx.fill();

  ctx.restore();
  ctx.restore();
}

// Floating interactive feature callout badge (crisp shadow, icon dot, bold text)
function drawCalloutChip(x, y, title, sub, enterT, opts = {}) {
  const {
    accent = '#DC2626',
    dark = false,
    align = 'left', // 'left' | 'right' | 'center'
    icon = '●',
  } = opts;
  const e = easeOutBack(enterT);
  if (e <= 0.02) return;

  ctx.save();
  ctx.globalAlpha = clamp(enterT * 2);
  ctx.font = `800 25px ${FONT_SANS}`;
  const w1 = ctx.measureText(title).width;
  ctx.font = `600 20px ${FONT_SANS}`;
  const w2 = sub ? ctx.measureText(sub).width : 0;

  const padL = 62;
  const padR = 26;
  const chipW = Math.max(w1, w2) + padL + padR;
  const chipH = sub ? 86 : 62;

  let bx = x;
  if (align === 'right') bx = x - chipW;
  else if (align === 'center') bx = x - chipW / 2;
  const by = y - chipH / 2 + (1 - clamp(enterT)) * 22;

  ctx.translate(bx + chipW / 2, by + chipH / 2);
  ctx.scale(lerp(0.84, 1, clamp(e, 0, 1.08)), lerp(0.84, 1, clamp(e, 0, 1.08)));
  ctx.translate(-(bx + chipW / 2), -(by + chipH / 2));

  ctx.shadowColor = 'rgba(15, 12, 10, 0.18)';
  ctx.shadowBlur = 28;
  ctx.shadowOffsetY = 12;
  rrect(bx, by, chipW, chipH, 22);
  ctx.fillStyle = dark ? 'rgba(28, 25, 23, 0.95)' : 'rgba(255, 255, 255, 0.96)';
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = dark ? 'rgba(255,255,255,0.14)' : 'rgba(28,25,23,0.09)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Accent icon badge circle
  ctx.beginPath();
  ctx.arc(bx + 32, by + chipH / 2, 17, 0, Math.PI * 2);
  ctx.fillStyle = accent;
  ctx.fill();

  ctx.font = `800 19px ${FONT_SANS}`;
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(icon, bx + 32, by + chipH / 2 + 1);

  ctx.textAlign = 'left';
  ctx.font = `800 24px ${FONT_SANS}`;
  ctx.fillStyle = dark ? '#FAFAF9' : '#171614';
  ctx.fillText(title, bx + padL, sub ? by + 30 : by + chipH / 2 + 1);

  if (sub) {
    ctx.font = `600 19px ${FONT_SANS}`;
    ctx.fillStyle = dark ? '#A8A29E' : '#57534E';
    ctx.fillText(sub, bx + padL, by + 60);
  }
  ctx.restore();
}

// Live animated Japanese Audio Waveform Pill
function drawAudioWaveChip(cx, cy, t, enterT) {
  const e = easeOutBack(enterT);
  if (e <= 0.02) return;
  const w = 360, h = 76;
  const x = cx - w / 2, y = cy - h / 2;

  ctx.save();
  ctx.globalAlpha = clamp(enterT * 2);
  ctx.translate(cx, cy);
  ctx.scale(e, e);
  ctx.translate(-cx, -cy);

  ctx.shadowColor = 'rgba(220,38,38,0.28)';
  ctx.shadowBlur = 26;
  ctx.shadowOffsetY = 10;
  rrect(x, y, w, h, 38);
  ctx.fillStyle = '#DC2626';
  ctx.fill();
  ctx.shadowBlur = 0;

  // Animated 9-bar equalizer
  const barStart = x + 30;
  for (let i = 0; i < 9; i++) {
    const amp = 0.28 + 0.72 * Math.abs(Math.sin(t * 11 + i * 0.95));
    const bh = 10 + amp * 32;
    ctx.fillStyle = '#FFFFFF';
    rrect(barStart + i * 11, cy - bh / 2, 6, bh, 3);
    ctx.fill();
  }

  ctx.font = `800 22px ${FONT_SANS}`;
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('Audio Jepang Aktif', x + 142, cy + 1);
  ctx.restore();
}

function drawFooterWatermark(darkMix = 0) {
  ctx.save();
  ctx.font = `700 22px ${FONT_SANS}`;
  ctx.fillStyle = darkMix > 0.5 ? 'rgba(255,255,255,0.48)' : 'rgba(28,25,23,0.45)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('utamago.vercel.app  •  Tampilan Asli Aplikasi UtamaGo!', W / 2, H - 56);
  ctx.restore();
}

// =========================================================================
// MAIN FRAME RENDERER (t in seconds: 0.00 .. 45.00)
// =========================================================================
window.renderFrame = function(t) {
  // Smooth dark mode transition during Scene 5 (36.6s -> 37.4s) and back for Scene 6 (39.7s -> 40.3s)
  let darkMix = 0;
  if (t >= 36.5 && t < 39.7) {
    darkMix = easeInOutCubic(norm(t, 36.5, 37.3));
  } else if (t >= 39.7 && t < 40.5) {
    darkMix = 1 - easeInOutCubic(norm(t, 39.7, 40.4));
  }

  drawEditorialBg(t, darkMix);

  // -----------------------------------------------------------------------
  // SCENE 0 (0.0s – 5.5s): HOOK & BRAND INTRO + REAL SCREEN FAN PREVIEW
  // -----------------------------------------------------------------------
  if (t < 5.5) {
    const outFade = 1 - easeInOutCubic(norm(t, 5.05, 5.5));
    ctx.save();
    ctx.globalAlpha = outFade;

    // Logo + Mascot Hero Lockup

    ctx.restore();

    // Pulsing Vermilion CTA URL Button
    const btnE = easeOutBack(norm(st, 0.7, 1.3));
    const pulse = 1 + Math.sin(st * 5.2) * 0.022;
    ctx.save();
    ctx.translate(W / 2, 875);
    ctx.scale(btnE * pulse, btnE * pulse);
    ctx.shadowColor = 'rgba(220, 38, 38, 0.36)';
    ctx.shadowBlur = 34;
    ctx.shadowOffsetY = 14;
    rrect(-315, -56, 630, 112, 56);
    const bg = ctx.createLinearGradient(-315, 0, 315, 0);
    bg.addColorStop(0, '#DC2626');
    bg.addColorStop(1, '#B91C1C');
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.font = `800 42px ${FONT_SANS}`;
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('utamago.vercel.app  →', 0, 2);
    ctx.restore();

    // Clean Beta badge below CTA
    const be = easeOutQuart(norm(st, 1.0, 1.55));
    ctx.save();
    ctx.globalAlpha = be;
    ctx.font = `700 26px ${FONT_SANS}`;
    ctx.fillStyle = '#78716C';
    ctx.textAlign = 'center';
    ctx.fillText('JLPT N5 · N4 · N3 · N2 · N1  •  Akses Beta Terbuka', W / 2, 985);
    ctx.restore();
  }

  // Persistent editorial top story progress bar + subtle bottom watermark
  drawTopProgressBar(t, darkMix);
  if (t >= 5.4 && t < 39.9) {
    drawFooterWatermark(darkMix);
  }
};

window.streamRange = async function(startIdx, endIdx, fps = 30) {
  for (let i = startIdx; i < endIdx; i++) {
    window.renderFrame(i / fps);
    const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.92));
    const resp = await fetch('/frame', { method: 'POST', body: blob });
    if (!resp.ok) throw new Error('Frame upload failed at ' + i);
  }
  return endIdx - startIdx;
};

window.finishStream = async function() {
  const resp = await fetch('/done', { method: 'POST' });
  return await resp.json();
};
</script>
